[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "euroc_full"
version = "1.0.0"
description = "EuRoC Full Matrix — Paper 1.A main result: IABE protocol validation across method families, regimes A/B, 10 seeds."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.1",
    "pyyaml>=6.0",
    "torch>=2.0",
    "einops>=0.6",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mamba = ["mamba-ssm>=1.2"]    # CUDA-only；不裝則純 PyTorch fallback

[project.scripts]
euroc-full = "euroc_full.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
